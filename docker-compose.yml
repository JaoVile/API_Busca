version: '3.8'
services:
  db:
    image: postgres:16-alpine
    container_name: api_busca_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: api_busca
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
